            <text x="20" y="44" class="chart-sub">Multi-Bar Chart | Requested vs. Completed vs. Rejected Cashouts</text>
            <line x1="20" y1="56" x2="537" y2="56" stroke="#F1F5F9" stroke-width="1.5"/>

