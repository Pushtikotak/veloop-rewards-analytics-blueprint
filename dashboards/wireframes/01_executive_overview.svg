            <text x="20" y="28" class="chart-header">Revenue &amp; Reward Liability Split</text>
            <text x="20" y="44" class="chart-sub">Stacked Area Chart | Partner Inflow vs. Credited User Liability</text>
            <line x1="20" y1="56" x2="537" y2="56" stroke="#F1F5F9" stroke-width="1.5"/>

            <!-- Chart Visual Mockup -->
